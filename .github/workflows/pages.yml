name: Website release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish after checks and deployment approval (leave off to prepare only)'
        type: boolean
        default: false
        required: true
permissions:
  contents: read
concurrency:
  group: website-release
  cancel-in-progress: false
jobs:
  build:
    name: Check and prepare production site
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: .cache/a11y-browsers
    steps:
      - name: Check out the selected main checkpoint
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Install pinned privacy scanner
        run: npm run setup:privacy -- --no-hooks
      - name: Install test browser
        run: npx --no-install playwright install --with-deps --only-shell chromium
      - name: Run all source and accessibility checks
        run: npm run check:all
      - name: Build and inspect the exact release files
        run: npm run build:release
      - name: Upload only the checked static website
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .cache/release-site
          retention-days: 1
  deploy:
    name: Publish approved website
    if: github.ref == 'refs/heads/main' && inputs.publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require the canonical custom domain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          domain=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.cname')
          test "$domain" = 'starbase430.com' || { echo 'Configure and verify starbase430.com before publishing.'; exit 1; }
      - name: Deploy the checked artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
