name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Privacy and release checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: .cache/a11y-browsers
    steps:
      - name: Check out reviewed change without persistent credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Install checksum-pinned privacy scanner
        run: npm run setup:privacy -- --no-hooks
      - name: Install test browser
        run: npx --no-install playwright install --with-deps --only-shell chromium
      - name: Run privacy, tests, structure, budgets, and accessibility
        run: npm run check:all
      - name: Inspect a fresh host-independent release build
        run: npm run build:release
